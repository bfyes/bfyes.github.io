{% if page.meta.comments != false %}
<script src="https://giscus.app/client.js"
  data-repo="bfyes/bfyes.github.io"
  data-repo-id="R_kgDOQ6xWqA"
  data-category="Announcements"
  data-category-id="DIC_kwDOQ6xWqM4DA0Jv"
  data-mapping="pathname"
  data-strict="1"
  data-reactions-enabled="1"
  data-emit-metadata="0"
  data-input-position="bottom"
  data-theme="preferred_color_scheme"
  data-lang="zh-CN"
  crossorigin="anonymous"
  async>
</script>

<script>
  var giscusScript = document.querySelector("script[src*=giscus]");
  var saved = (typeof __md_get === "function") ? __md_get("__palette") : null;
  var scheme = (saved && saved.color && saved.color.scheme) || "default";
  var theme = scheme === "slate" ? "dark" : "light";
  if (giscusScript) giscusScript.setAttribute("data-theme", theme);

  function setGiscusTheme(mode) {
    var frame = document.querySelector(".giscus-frame");
    if (frame) frame.contentWindow.postMessage(
      { giscus: { setConfig: { theme: mode === "dark" ? "dark" : "light" } } }, "https://giscus.app"
    );
  }
  function trySubscribe() {
    if (window.site && window.site.theme) {
      window.site.theme.subscribe(setGiscusTheme);
      return true;
    }
    return false;
  }
  if (!trySubscribe()) document.addEventListener("DOMContentLoaded", trySubscribe);
</script>
{% endif %}
