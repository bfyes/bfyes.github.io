<!-- Giscus 评论区 -->
{% if page.meta.comments != false %}
<div class="giscus"></div>
<script>
  // 让 giscus 首次加载和后续切换都跟随站点主题。
  (function () {
    var SCRIPT_ID = "bfyes-giscus-client";
    var FRAME_SEL = "iframe.giscus-frame";
    var lastTheme = null;

    function currentMode() {
      if (window.bfyes && window.bfyes.theme) return window.bfyes.theme.mode;
      var htmlScheme = document.documentElement.getAttribute("data-md-color-scheme");
      var bodyScheme = document.body && document.body.getAttribute("data-md-color-scheme");
      return (htmlScheme || bodyScheme) === "slate" ? "dark" : "light";
    }

    function themeFor(mode) {
      // dark = GitHub dark (#0d1117 纯净黑底)，比 dark_dimmed 的灰底更干净。
      return mode === "dark" ? "dark" : "light";
    }

    function getFrame() {
      return document.querySelector(FRAME_SEL);
    }

    function postTheme(theme) {
      var iframe = getFrame();
      if (!iframe || !iframe.contentWindow) return false;
      iframe.contentWindow.postMessage(
        { giscus: { setConfig: { theme: theme } } },
        "https://giscus.app"
      );
      return true;
    }

    function sync(mode) {
      var theme = themeFor(mode || currentMode());
      if (theme === lastTheme) return;
      if (!postTheme(theme)) return;
      lastTheme = theme;
    }

    function loadGiscus() {
      if (document.getElementById(SCRIPT_ID)) return;
      var script = document.createElement("script");
      script.id = SCRIPT_ID;
      script.src = "https://giscus.app/client.js";
      script.async = true;
      script.crossOrigin = "anonymous";
      script.setAttribute("data-repo", "bfyes/bfyes.github.io");
      script.setAttribute("data-repo-id", "R_kgDOQ6xWqA");
      script.setAttribute("data-category", "Announcements");
      script.setAttribute("data-category-id", "DIC_kwDOQ6xWqM4DA0Jv");
      script.setAttribute("data-mapping", "pathname");
      script.setAttribute("data-strict", "1");
      script.setAttribute("data-reactions-enabled", "1");
      script.setAttribute("data-emit-metadata", "0");
      script.setAttribute("data-input-position", "bottom");
      script.setAttribute("data-theme", themeFor(currentMode()));
      script.setAttribute("data-lang", "zh-CN");
      document.currentScript.parentNode.appendChild(script);
    }

    function bindThemeChanges() {
      if (window.bfyes && window.bfyes.theme) {
        window.bfyes.theme.subscribe(sync);
        return;
      }
      if (typeof MutationObserver === "undefined") return;
      new MutationObserver(function () { sync(); }).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-md-color-scheme"],
      });
    }

    function syncWhenFrameReady() {
      if (getFrame()) {
        sync();
        return;
      }
      if (typeof MutationObserver === "undefined" || !document.body) return;
      var obs = new MutationObserver(function () {
        if (!getFrame()) return;
        obs.disconnect();
        sync();
      });
      obs.observe(document.body, { childList: true, subtree: true });
      setTimeout(function () { obs.disconnect(); }, 8000);
    }

    loadGiscus();
    bindThemeChanges();
    syncWhenFrameReady();

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", sync);
    } else {
      sync();
    }
  })();
</script>
{% endif %}
