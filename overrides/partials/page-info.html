{% if page.meta.page_info != false %}
<script src="{{ 'theme/page-metadata.js' | url }}"></script>

<div class="page-info">
  <span class="page-info__item page-info__updated" hidden>
    <span class="page-info__label">最后更新于 / Last updated</span>
    <span class="page-info__value"><time id="page-last-updated" datetime=""></time></span>
  </span>
  <span class="page-info__item" id="busuanzi_container_site_pv">
    <span class="page-info__label">本站总浏览 / Site views</span>
    <span class="page-info__value"><span id="busuanzi_value_site_pv"></span></span>
  </span>
  <span class="page-info__item page-info__stars">
    <span class="page-info__label">
      有用的话请给我个
      <a href="https://github.com/bfyes/bfyes.github.io/stargazers">star</a>
      =&gt;
    </span>
    <span class="page-info__value">
      <a href="https://github.com/bfyes/bfyes.github.io/stargazers" aria-label="GitHub Stars">
        <img
          alt="Stars"
          src="https://img.shields.io/github/stars/bfyes/bfyes.github.io?label=Stars&style=flat"
        >
      </a>
    </span>
  </span>
</div>

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

<script>
  (function () {
    function pageMetaCandidates() {
      var path = window.location.pathname || "/";
      var decoded = path;
      try {
        decoded = decodeURIComponent(path);
      } catch (e) {}

      return [
        path,
        decoded,
        path.endsWith("/") ? path : path + "/",
        decoded.endsWith("/") ? decoded : decoded + "/",
      ];
    }

    function renderLastUpdated() {
      var meta = window.__BFYES_PAGE_META__ || {};
      var candidates = pageMetaCandidates();
      var data = null;

      for (var i = 0; i < candidates.length; i++) {
        if (meta[candidates[i]]) {
          data = meta[candidates[i]];
          break;
        }
      }

      var wrap = document.querySelector(".page-info__updated");
      var time = document.querySelector("#page-last-updated");
      if (!wrap || !time || !data || !data.updated) {
        return;
      }

      var date = new Date(data.updated);
      time.dateTime = data.updated;
      time.textContent = date.toLocaleDateString("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      });
      wrap.hidden = false;
    }

    function renderPageInfo() {
      renderLastUpdated();
    }

    if (!window.__bfyesPageInfoReady) {
      window.__bfyesPageInfoReady = true;
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", renderPageInfo);
      } else {
        renderPageInfo();
      }

      if (window.document$) {
        window.document$.subscribe(renderPageInfo);
      }
    } else {
      renderPageInfo();
    }
  })();
</script>
{% endif %}
