{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script data-goatcounter="https://bfyes.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
  <script>
    (function () {
      var countedPath = location.pathname + location.search;

      function countGoatCounterPageview() {
        var path = location.pathname + location.search;
        if (path === countedPath || !window.goatcounter || typeof window.goatcounter.count !== "function") {
          return;
        }

        countedPath = path;
        window.goatcounter.count({
          path: path,
          title: document.title,
        });
      }

      if (window.document$) {
        window.document$.subscribe(countGoatCounterPageview);
      }
    })();
  </script>
  <script>
    (function () {
      try {
        var saved = (typeof __md_get === "function") ? __md_get("__palette") : null;
        var scheme;
        if (saved && saved.color && saved.color.media) {
          if (saved.color.media === "(prefers-color-scheme)") {
            scheme = matchMedia("(prefers-color-scheme: dark)").matches ? "slate" : "default";
          } else {
            scheme = saved.color.scheme;
          }
        } else {
          scheme = matchMedia("(prefers-color-scheme: dark)").matches ? "slate" : "default";
        }
        document.documentElement.setAttribute("data-md-color-scheme", scheme);
        var attach = function () {
          document.body.setAttribute("data-md-color-scheme", scheme);
          new MutationObserver(function () {
            var s = document.body.getAttribute("data-md-color-scheme");
            if (s) document.documentElement.setAttribute("data-md-color-scheme", s);
          }).observe(document.body, {
            attributes: true,
            attributeFilter: ["data-md-color-scheme"],
          });
        };
        if (document.body) {
          attach();
        } else {
          new MutationObserver(function (_, obs) {
            if (document.body) {
              attach();
              obs.disconnect();
            }
          }).observe(document.documentElement, { childList: true });
        }
      } catch (e) {}
    })();
  </script>
{% endblock %}
