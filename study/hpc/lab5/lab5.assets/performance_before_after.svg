<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",Arial,sans-serif;fill:#202124}.title{font-size:22px;font-weight:700}.label{font-size:14px}.small{font-size:12px;fill:#5f6368}.value{font-size:13px;font-weight:600}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="55" y="45" class="title">端到端优化阶段对比</text>
<text x="55" y="70" class="small">HPC 端到端时间；每个柱表示相对前一阶段保留的累计优化</text>
<rect x="120" y="148.1" width="82" height="291.9" rx="3" fill="#c0504d"/>
<text x="161" y="139.1" text-anchor="middle" class="value">165.4s</text>
<text x="161" y="463" text-anchor="middle" class="label">Python</text>
<text x="161" y="479" text-anchor="middle" class="label">dequant</text>
<rect x="257" y="236.7" width="82" height="203.3" rx="3" fill="#e8833a"/>
<text x="298" y="227.7" text-anchor="middle" class="value">115.2s</text>
<text x="298" y="463" text-anchor="middle" class="label">Triton</text>
<text x="298" y="479" text-anchor="middle" class="label">+cuBLAS</text>
<rect x="394" y="283.2" width="82" height="156.8" rx="3" fill="#8a6db1"/>
<text x="435" y="274.2" text-anchor="middle" class="value">88.9s</text>
<text x="435" y="463" text-anchor="middle" class="label">+SDPA</text>
<rect x="531" y="342.4" width="82" height="97.6" rx="3" fill="#2ca6a0"/>
<text x="572" y="333.4" text-anchor="middle" class="value">55.3s</text>
<text x="572" y="463" text-anchor="middle" class="label">+INT4</text>
<text x="572" y="479" text-anchor="middle" class="label">GEMV</text>
<rect x="668" y="365.7" width="82" height="74.3" rx="3" fill="#7fb3d5"/>
<text x="709" y="356.7" text-anchor="middle" class="value">42.1s</text>
<text x="709" y="463" text-anchor="middle" class="label">+warmup</text>
<rect x="805" y="375.8" width="82" height="64.2" rx="3" fill="#3b6fb6"/>
<text x="846" y="366.8" text-anchor="middle" class="value">36.4s</text>
<text x="846" y="463" text-anchor="middle" class="label">+CUDA</text>
<text x="846" y="479" text-anchor="middle" class="label">Graph</text>
<line x1="75" y1="440" x2="940" y2="440" stroke="#5f6368"/>
<text x="55" y="505" class="small">INT4 GEMV 是最大单步跃迁（88.9s → 55.3s）；最终版本相对 Python 反量化基线缩短 78.0%。</text>
</svg>