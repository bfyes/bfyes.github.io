<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",Arial,sans-serif;fill:#202124}.title{font-size:22px;font-weight:700}.label{font-size:14px}.small{font-size:12px;fill:#5f6368}.value{font-size:13px;font-weight:600}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="55" y="45" class="title">量化迭代前后：delta NLL</text>
<text x="55" y="70" class="small">数据来源：质量评测 JSON；虚线为 S1 满分线 0.10 与硬阈值 0.16</text>
<line x1="90" y1="377.2" x2="950" y2="377.2" stroke="#e8833a" stroke-width="2" stroke-dasharray="6 5"/>
<text x="842" y="372.2" class="small" fill="#e8833a">满分线 0.10</text>
<line x1="90" y1="333.5" x2="950" y2="333.5" stroke="#c0504d" stroke-width="2" stroke-dasharray="6 5"/>
<text x="842" y="328.5" class="small" fill="#c0504d">硬阈值 0.16</text>
<rect x="125" y="238.4" width="68" height="211.6" rx="3" fill="#c0504d"/>
<text x="159" y="229.4" text-anchor="middle" class="value">0.2906</text>
<text x="159" y="474" text-anchor="middle" class="label">RTN</text>
<rect x="243" y="150.5" width="68" height="299.5" rx="3" fill="#c0504d"/>
<text x="277" y="141.5" text-anchor="middle" class="value">0.4113</text>
<text x="277" y="474" text-anchor="middle" class="label">GPTQ v1</text>
<rect x="361" y="295.5" width="68" height="154.5" rx="3" fill="#c0504d"/>
<text x="395" y="286.5" text-anchor="middle" class="value">0.2122</text>
<text x="395" y="474" text-anchor="middle" class="label">v2</text>
<rect x="479" y="277.5" width="68" height="172.5" rx="3" fill="#c0504d"/>
<text x="513" y="268.5" text-anchor="middle" class="value">0.2368</text>
<text x="513" y="474" text-anchor="middle" class="label">v5</text>
<rect x="597" y="261.7" width="68" height="188.3" rx="3" fill="#c0504d"/>
<text x="631" y="252.7" text-anchor="middle" class="value">0.2585</text>
<text x="631" y="474" text-anchor="middle" class="label">v6</text>
<rect x="715" y="379.2" width="68" height="70.8" rx="3" fill="#2ca6a0"/>
<text x="749" y="370.2" text-anchor="middle" class="value">0.0972</text>
<text x="749" y="474" text-anchor="middle" class="label">v7</text>
<rect x="833" y="382.6" width="68" height="67.4" rx="3" fill="#3b6fb6"/>
<text x="867" y="373.6" text-anchor="middle" class="value">0.0925</text>
<text x="867" y="474" text-anchor="middle" class="label">final</text>
<line x1="90" y1="450" x2="950" y2="450" stroke="#5f6368"/>
<text x="55" y="485" class="small">非对称 INT4（v7）使 delta NLL 从对称 GPTQ v2 的 0.2122 降至 0.0972；稳定化后为 0.0925。</text>
</svg>