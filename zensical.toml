[project]
site_name = "bfyes"
site_url = ""
repo_url = "https://github.com/bfyes/bfyes.github.io"
repo_name = "bfyes/bfyes.github.io"
edit_uri = ""
site_description = ""
site_author = ""
copyright = ""

nav = [
    { "主页" = "index.md" },
    { "学习" = [
        { "汇编语言设计与调试" = "study/asm.md" },
        { "信息安全原理与数学基础" = "study/ismath.md" },
    ] },
    { "工具" = [
        { "Windows XP on Apple Silicon" = "tools/windows-xp-apple-silicon.md" },
        { "Vivado on Apple Silicon" = "tools/vivado-apple-silicon.md" },
        { "Mac 上好用的记事本" = "tools/mac上好用的第三方记事本软件.md" },
    ] },
    { "随笔" = [
        { "25-26春夏 半期总结" = "diaries/midterm.md" },
    ] },
]

extra_css = [
    "theme/main.css",
]

extra_javascript = [
    "theme/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

# --------------------------------------------------------------------------
# Theme
# --------------------------------------------------------------------------
[project.theme]
custom_dir = "overrides"
logo = ""
favicon = ""
features = [
    "content.action.edit",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "navigation.expand",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.share",
    "search.suggest",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换至浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换至深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "根据系统模式切换主题"

# --------------------------------------------------------------------------
# Markdown extensions
# --------------------------------------------------------------------------
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.critic]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true
linenums = true
linenums_style = "pymdownx-inline"

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions."neoteroi.timeline"]
[project.markdown_extensions."neoteroi.projects"]
[project.markdown_extensions."neoteroi.cards"]

# --------------------------------------------------------------------------
# Plugins
# --------------------------------------------------------------------------
[project.plugins.glightbox]
[project.plugins.tags]
